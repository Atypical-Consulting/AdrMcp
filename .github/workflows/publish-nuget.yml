name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The repo has no packages.lock.json, so setup-dotnet's `cache: true` (which requires
      # lock files) cannot be used - cache the global NuGet package folder directly instead.
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: |
          dotnet pack AdrMcp/AdrMcp.csproj \
            -c Release \
            --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o ./nupkg

      # A green `dotnet pack` only means the command exited 0. Assert the packed version
      # actually matches the release tag before it leaves the building, so a mis-stamped
      # package can never reach NuGet.
      - name: Verify packed version
        run: |
          want="${{ steps.version.outputs.VERSION }}"
          pkg="$(ls ./nupkg/AdrMcp.*.nupkg | head -1)"
          echo "Packed: $pkg (expecting version $want)"
          case "$pkg" in
            *"AdrMcp.$want.nupkg") echo "Version OK: $want" ;;
            *) echo "::error::Packed file $pkg does not match expected version $want."; exit 1 ;;
          esac

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # A git tag is not a GitHub Release - one must be created explicitly. Do it after a
      # successful NuGet push so every published version has a matching Release with the
      # .nupkg attached. Idempotent so a re-run on the same tag heals rather than errors.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="${{ steps.version.outputs.VERSION }}"
          notes="Release v$want. Install with: dotnet tool install -g AdrMcp --version $want"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists - updating notes and assets."
            gh release edit "$GITHUB_REF_NAME" --title "v$want" --notes "$notes"
            gh release upload "$GITHUB_REF_NAME" ./nupkg/*.nupkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "v$want" \
              --notes "$notes" \
              --verify-tag \
              ./nupkg/*.nupkg
          fi
